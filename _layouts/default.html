<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title and page.title != "Home" %}{{ page.title }} – {% endif %}{{ site.name }}</title>
    {% include meta.html %}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Molengo|Cantarell:400,700&display=swap" />
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body>
    <div class="container">
      <nav class="site-nav">
        <a href="{{ site.baseurl }}/">Home</a>
        <a href="{{ site.baseurl }}/publications/">Publications</a>
        {% assign public_posts = site.posts | where_exp: "p", "p.archived != true" %}
        {% if public_posts.size > 0 %}<a href="{{ site.baseurl }}/blog/">Writing</a>{% endif %}
      </nav>

      <main id="main" role="main">
        {{ content }}
      </main>

      <footer class="site-footer">
        {{ site.name }} · Views are my own, not those of my employer.
      </footer>
    </div>

    {% include analytics.html %}
  </body>
</html>
